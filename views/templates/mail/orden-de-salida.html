
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo</title>
        
    <style>

        .body{
            display: grid;
            place-items: center;
        }

        .body>main{
            
            box-shadow: inset 0px 0px 22px 13px #e1e1e1;
            border-radius: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 40vw;
            height: 70vh;
            padding: 1rem;
        }


        span{
            color: #4600FF;
        }

        .header-mail{

            font-family: Pangram-Black;
            letter-spacing: 1px;
            text-align: center;
            color: #0E1D62;

        }
        .link-order{
            text-align: center;
            font-size: 2rem;
            text-decoration: none;
            color: #4600FF;
        }
    </style>
</head>
<body class="body">


    <main>
        <h1 class="header-mail">Te han generado una Orden de Salida</h1>    
    
        <h2 class="header-mail">Salida para el <span>{ {salida} }</span></h2>
        <h2 class="header-mail">Retorno designado para el dia <span>{ {retorno} }</span></h2>



        <a class="link-order" href="{ {link} }">Ver mi orden</a>
    </main>





</body>
